[package]
name = "rt-next-week"
version = "1.1.1"
edition = "2021"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["png"] }
indicatif = { version = "0.17", features = ["rayon"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
cuda = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
